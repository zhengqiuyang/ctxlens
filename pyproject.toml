[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctxlens"
version = "0.1.0"
description = "X-ray for your coding agent's context window — what ate your tokens? Deterministic, zero LLM, local-first."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ctxlens contributors" }]
keywords = [
    "ai-agents",
    "claude-code",
    "codex",
    "opencode",
    "context-window",
    "token-usage",
    "observability",
    "cli",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
ctxlens = "ctxlens.cli:main"

[project.urls]
Homepage = "https://github.com/zhengqiuyang/ctxlens"
Issues = "https://github.com/zhengqiuyang/ctxlens/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# The project keeps typing.List/Optional spelling for 3.9 compatibility,
# so pyupgrade (UP) rewrites are deliberately not selected.
select = ["E4", "E7", "E9", "F", "I"]
